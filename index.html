<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clips</title>
<style>
  :root {
    --bg: #f7f5f1; --surface: #ffffff; --ink: #23201b;
    --ink-secondary: #57524a; --border: rgba(35,32,27,0.12);
    --accent: #a8752c; --accent-bg: #f3e6cc;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171f; --surface: #1b1f2a; --ink: #ece9e2;
      --ink-secondary: #a9a49a; --border: rgba(236,233,226,0.12);
      --accent: #d9a441; --accent-bg: rgba(217,164,65,0.14);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .page {
    background: var(--bg); color: var(--ink); font-family: var(--font-sans);
    min-height: 100vh; padding: 3rem 1.25rem 4rem;
    display: flex; align-items: center; justify-content: center;
  }
  .doc {
    max-width: 480px; margin: 0 auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    padding: clamp(1.5rem, 5vw, 3rem); text-align: center;
  }
  .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 10px;
    background: var(--accent-bg); color: var(--accent);
    font-family: var(--font-mono); font-weight: 700; font-size: 18px;
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  p { font-size: 15px; line-height: 1.65; color: var(--ink-secondary); }
  a { color: var(--accent); }
  nav { margin-top: 1.5rem; display: flex; gap: 1.5rem; justify-content: center; }
</style>
</head>
<body>
<div class="page">
  <div class="doc">
    <span class="mark">FC</span>
    <h1>Clips</h1>
    <p>A personal-use app that publishes video content to a single connected TikTok account on behalf of its owner.</p>
    <nav>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </div>
</div>
</body>
</html>
